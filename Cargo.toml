[package]
name = "cf-nix"
version = "0.1.0"
edition = "2021"
authors = ["iamralch"]

[lib]
crate-type = ["cdylib"]

[dependencies]
narinfo = "1.0.1"
worker = { version = "0.8" }
worker-macros = { version = "0.8" }

[dev-dependencies]
reqwest = "0.13.3"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
