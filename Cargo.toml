[package]
name = "nix-cache"
version = "0.1.0"
edition = "2021"
authors = ["iamralch"]

[lib]
crate-type = ["cdylib"]

[dependencies]
http-auth-basic = "0.3.7"
narinfo = "1.0.1"
worker = { version = "0.8" }
worker-macros = { version = "0.8" }

[dev-dependencies]
reqwest = "0.13.3"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[features]
# Opt-in integration tests which require `wrangler dev` running locally.
integration = []
